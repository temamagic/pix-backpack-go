name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        go: ['1.25.0', '1.27.1']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Formatting
        shell: bash
        run: |
          files="$(gofmt -l ble pix cmd examples)"
          if [ -n "$files" ]; then
            printf 'Files requiring gofmt:\n%s\n' "$files"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Race detector
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: macOS executable metadata
        if: runner.os == 'macOS'
        run: ./build.sh pixctl
      - name: Publication safety
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check-publication.py --history
      - name: Portable codecs without CGO
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: '0'
        run: go test ./...
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - run: golangci-lint config verify
      - run: golangci-lint run
